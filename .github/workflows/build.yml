name: Build Handy fleet packages

on:
  schedule:
    - cron: "0 14 * * *"
  repository_dispatch:
    types: [new-upstream-release]
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if release already exists"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.verify.outputs.ready }}
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify upstream release
        id: verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force == true && '1' || '0' }}
        run: python3 scripts/verify_release.py
      - name: Upload verified assets
        if: steps.verify.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verified-assets
          path: verified/
          retention-days: 1

  build-pkg:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [aarch64, x64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-assets
          path: verified
      - name: Build .pkg
        run: |
          set -euo pipefail
          mkdir -p root/Applications
          tar -xzf "verified/Handy_${{ matrix.arch }}.app.tar.gz" -C root/Applications
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw root/Applications/Handy.app/Contents/Info.plist)
          VERSION=$(plutil -extract CFBundleShortVersionString raw root/Applications/Handy.app/Contents/Info.plist)
          pkgbuild --root root --identifier "$BUNDLE_ID" --version "$VERSION" \
            --install-location /Applications "Handy-${VERSION}-${{ matrix.arch }}.pkg"
          echo "PKG_PATH=Handy-${VERSION}-${{ matrix.arch }}.pkg" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.arch }}
          path: ${{ env.PKG_PATH }}
          retention-days: 1

  build-intunewin:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-assets
          path: verified
      - name: Build MSI wrapper
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.check.outputs.tag }}"
          VERSION="${VERSION#v}"
          SETUP_FILE="Handy_${VERSION}_x64-setup.exe"

          # Build MSI that wraps the NSIS exe
          candle.exe -dVersion="${VERSION}.0" -dSetupExe="verified/${SETUP_FILE}" \
            -out handy.wixobj scripts/handy-wrapper.wxs
          light.exe -out "Handy_${VERSION}_x64.msi" handy.wixobj \
            -ext WixUIExtension -sval

          echo "MSI_FILE=Handy_${VERSION}_x64.msi" >> "$GITHUB_ENV"
          echo "SETUP_FILE=${SETUP_FILE}" >> "$GITHUB_ENV"
      - name: Build .intunewin
        shell: bash
        run: |
          set -euo pipefail
          curl -sL -o IntuneWinAppUtil.exe https://raw.githubusercontent.com/microsoft/Microsoft-Win32-Content-Prep-Tool/master/IntuneWinAppUtil.exe
          mkdir -p source output
          cp "${{ env.MSI_FILE }}" "source/"
          # Include the exe alongside so the MSI can find it during install
          cp "verified/${{ env.SETUP_FILE }}" "source/"
          ./IntuneWinAppUtil.exe -c source -s "${{ env.MSI_FILE }}" -o output -q
      - uses: actions/upload-artifact@v4
        with:
          name: intunewin-x64
          path: output/*.intunewin
          retention-days: 1

  publish:
    needs: [check, build-pkg, build-intunewin]
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.check.outputs.tag }}"
          # Delete existing release if force-rebuilding
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Deleting existing release $TAG for rebuild..."
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Handy ${TAG} (packaged)" \
            --notes "Verified Handy ${TAG}: minisign checked. See manifest.json for checksums." \
            artifacts/*.pkg artifacts/*.intunewin \
            artifacts/*.deb artifacts/*.rpm artifacts/*.AppImage \
            artifacts/*.dmg artifacts/*.exe artifacts/*.msi \
            artifacts/manifest.json

